<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajwaa - Design System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Palette */
            --c-sand: #F2EBE0;
            --c-paper: #FFFFFF;
            --c-red: #D00000;
            --c-red-wash: #FFE5E5;
            --c-volt: #CCFF00;
            --c-espresso: #2B2118;
            --c-taupe: #8C847C;

            /* Spacing */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;

            /* Radius */
            --r-sm: 12px;
            --r-md: 24px;
            --r-lg: 32px;
            --r-full: 999px;

            /* Shadow */
            --shadow-soft: 0 12px 40px -8px rgba(43, 33, 24, 0.08);
            --shadow-hard: 0 4px 0 rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #E5E5E5;
            /* Canvas background */
            color: var(--c-espresso);
            margin: 0;
            padding: 40px;
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Device Frame */
        .device {
            width: 390px;
            height: 844px;
            background: var(--c-sand);
            border-radius: 48px;
            box-shadow: 0 0 0 12px #111, 0 40px 80px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Notches/Bars */
        .status-bar {
            height: 44px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
        }

        .home-bar {
            width: 140px;
            height: 5px;
            background: #000;
            border-radius: 10px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.2;
        }

        /* SCROLLABLE AREA */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 100px;
        }

        .screen-content::-webkit-scrollbar {
            display: none;
        }

        /* TYPOGRAPHY */
        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        .text-hero {
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }

        .text-h2 {
            font-size: 24px;
            font-weight: 800;
        }

        .text-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--c-taupe);
        }

        /* COMPONENTS */
        .card {
            background: var(--c-paper);
            border-radius: var(--r-md);
            padding: 24px;
            box-shadow: var(--shadow-soft);
            margin-bottom: 16px;
        }

        .btn {
            border: none;
            padding: 16px 32px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-volt {
            background: var(--c-volt);
            color: var(--c-espresso);
        }

        .btn-red {
            background: var(--c-red);
            color: white;
        }

        /* SCREEN 1: BRANDING SPLASH */
        .screen-splash {
            background: var(--c-red);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 40px;
        }

        .logo-mark {
            width: 80px;
            height: 80px;
            background: white;
            color: var(--c-red);
            border-radius: 20px;
            display: grid;
            place-items: center;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        /* SCREEN 2: DASHBOARD */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-top: 16px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 12px;
            border-radius: var(--r-full);
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-soft);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--c-red);
            border-radius: 50%;
        }

        .hero-ring {
            background: var(--c-paper);
            border-radius: var(--r-lg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .ring-svg {
            width: 160px;
            height: 160px;
            transform: rotate(-90deg);
            margin-bottom: 16px;
        }

        .ring-bg {
            stroke: var(--c-sand);
            stroke-width: 12;
            fill: none;
        }

        .ring-val {
            stroke: var(--c-red);
            stroke-width: 12;
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 120;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .mini-stat {
            background: white;
            padding: 20px;
            border-radius: var(--r-md);
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: var(--c-red-wash);
            color: var(--c-red);
            border-radius: 12px;
            display: grid;
            place-items: center;
            margin-bottom: 8px;
        }

        /* NAV DOCK */
        .dock {
            position: absolute;
            bottom: 32px;
            left: 24px;
            right: 24px;
            background: #222;
            padding: 16px 24px;
            border-radius: var(--r-full);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .nav-item {
            color: rgba(255, 255, 255, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--c-volt);
        }

        .nav-fab {
            width: 56px;
            height: 56px;
            background: var(--c-volt);
            color: var(--c-espresso);
            border-radius: 50%;
            margin-top: -48px;
            border: 6px solid var(--c-sand);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <!-- MOCKUP 1: Branding -->
    <div class="device">
        <div class="status-bar" style="color:rgba(255,255,255,0.5)"><span>9:41</span><span>Ajwaa</span></div>
        <div class="screen-splash">
            <div class="logo-mark">A</div>
            <h1 class="text-hero" style="margin-bottom: 16px;">Ajwaa</h1>
            <p style="opacity:0.8; margin-bottom: 48px; font-size: 18px;">Clean. Simple. Powerful.</p>
            <button class="btn btn-volt">
                Get Started
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </button>
        </div>
        <div class="home-bar" style="background:white"></div>
    </div>

    <!-- MOCKUP 2: Dashboard -->
    <div class="device">
        <div class="status-bar"><span>9:41</span><span>100%</span></div>
        <div class="screen-content">
            <!-- Header -->
            <header class="header">
                <div class="user-chip">
                    <div class="user-avatar"></div>
                    Hello, Saeed
                </div>
                <div style="background:white; padding:10px; border-radius:50%; box-shadow:var(--shadow-soft)">
                    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
            </header>

            <!-- Hero Ring -->
            <div class="hero-ring">
                <svg class="ring-svg" viewBox="0 0 100 100">
                    <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
                    <circle class="ring-val" cx="50" cy="50" r="40"></circle>
                </svg>
                <div style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); text-align:center;">
                    <div class="text-hero" style="font-size:36px; color:var(--c-red)">1,240</div>
                    <div class="text-label">KCAL</div>
                </div>
                <div style="display:flex; justify-content:space-between; width:100%; margin-top:16px; padding:0 16px;">
                    <div class="text-label">Left<br><span style="color:var(--c-espresso); font-size:16px;">760</span>
                    </div>
                    <div class="text-label" style="text-align:right">Goal<br><span
                            style="color:var(--c-espresso); font-size:16px;">2,000</span></div>
                </div>
            </div>

            <div class="text-label" style="margin-bottom:16px;">Today's Focus</div>

            <!-- Grid -->
            <div class="stat-grid">
                <div class="mini-stat">
                    <div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="2" fill="none">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                        </svg></div>
                    <div class="text-h2">45m</div>
                    <div class="text-label">Training</div>
                </div>
                <div class="mini-stat">
                    <div class="stat-icon" style="background:var(--c-volt); color:#222;"><svg width="20" height="20"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
                        </svg></div>
                    <div class="text-h2">1.5L</div>
                    <div class="text-label">Water</div>
                </div>
            </div>

            <!-- Workout List -->
            <div class="card" style="display:flex; align-items:center; gap:16px;">
                <div
                    style="width:56px; height:56px; background:#222; border-radius:16px; display:grid; place-items:center; color:white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5zM16 8L2 22M17.5 15H9" />
                    </svg>
                </div>
                <div style="flex:1;">
                    <div style="font-weight:700; margin-bottom:4px;">Full Body Strength</div>
                    <div class="text-label">45 Mins • High Intensity</div>
                </div>
                <div
                    style="width:32px; height:32px; background:var(--c-sand); border-radius:50%; display:grid; place-items:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"
                        fill="none">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Nav Dock -->
        <div class="dock">
            <div class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </div>
            <div class="nav-fab">
                <svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                    <path d="M12 5v14M5 12h14" />
                </svg>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M23 7l-7 5 7 5V7z" />
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                </svg>
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
        </div>

        <div class="home-bar"></div>
    </div>

</body>

</html>
