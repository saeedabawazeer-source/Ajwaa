<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ajwaa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- OVERLAY: ACTIVE WORKOUT TIMER -->
    <div id="active-workout-overlay" class="hidden">
        <div class="card" style="border:none; background:transparent; box-shadow:none;">
            <div class="text-label" style="margin-bottom:12px;">IN PROGRESS</div>
            <div id="active-title" class="text-hero" style="font-size:32px; line-height:1.1;">Workout</div>
            <div id="active-type" class="text-label" style="color:var(--c-red); margin-top:8px;">INTENSITY</div>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center;">
            <div class="hero-ring" style="width:200px; height:200px;">
                <svg class="ring-svg" viewBox="0 0 100 100" style="transform: rotate(-90deg);">
                    <circle cx="50" cy="50" r="45" style="fill:none; stroke: white; stroke-width:6;"></circle>
                    <circle id="timer-ring-val" cx="50" cy="50" r="45"
                        style="fill:none; stroke: var(--c-black); stroke-width:6; stroke-dasharray:283; stroke-dashoffset:0; transition: stroke-dashoffset 1s linear;">
                    </circle>
                </svg>
                <div class="ring-content">
                    <div id="active-timer" class="text-hero" style="font-size:42px;">00:00</div>
                </div>
            </div>
        </div>
        <div style="display:flex; gap:16px; width:100%;">
            <button id="cancel-workout-btn" class="btn btn-red" style="flex:1;">CANCEL</button>
            <button id="complete-workout-btn" class="btn btn-volt" style="flex:1;">FINISH</button>
        </div>
    </div>

    <!-- ACTION SHEET OVERLAY -->
    <div id="action-sheet-overlay" class="hidden"
        style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1900;" onclick="closeActionSheet()"></div>
    <div id="action-sheet">
        <div class="sheet-header">
            <div class="text-h2">Quick Add</div>
            <button onclick="closeActionSheet()" style="padding:8px;"><svg width="24" height="24" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="3" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" />
                </svg></button>
        </div>

        <button class="action-btn" onclick="openLogFood()">
            <div class="action-icon" style="background:var(--c-red-light);">🍎</div>
            <div>
                <div>Log Meal</div>
                <div class="text-label">CALORIES & MACROS</div>
            </div>
        </button>

        <button class="action-btn" onclick="quickAdd('water')">
            <div class="action-icon" style="background:var(--c-volt);">💧</div>
            <div>
                <div>Add Water</div>
                <div class="text-label">+250 ML</div>
            </div>
        </button>

        <button class="action-btn" onclick="openLogWorkout()">
            <div class="action-icon" style="background:white;">🏋️</div>
            <div>
                <div>Log Workout</div>
                <div class="text-label">SETS · REPS · WEIGHT</div>
            </div>
        </button>
    </div>

    <!-- LOG FOOD MODAL -->
    <div id="modal-log-food" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="text-h2" style="margin-bottom:20px;">Log Meal</div>
            <div class="input-group">
                <label class="input-label">Meal Name</label>
                <input type="text" id="input-food-name" class="input-field" placeholder="e.g. Chicken Salad">
            </div>
            <div class="input-group">
                <label class="input-label">Calories (kcal)</label>
                <input type="number" id="input-food-cals" class="input-field" placeholder="0">
            </div>
            <div style="display:flex; gap:12px; margin-top:24px;">
                <button class="btn" style="flex:1;" onclick="closeLogFood()">CANCEL</button>
                <button class="btn btn-volt" style="flex:1;" onclick="saveLogFood()">SAVE</button>
            </div>
        </div>
    </div>

    <!-- LOG WORKOUT MODAL -->
    <div id="modal-log-workout" class="modal-overlay hidden">
        <div class="modal-card" style="max-height:80vh; overflow-y:auto;">
            <div class="text-h2" style="margin-bottom:20px;">💪 Log Session</div>

            <div class="input-group">
                <label class="input-label">Session Name</label>
                <input type="text" id="input-workout-name" class="input-field" placeholder="e.g. Chest Day">
            </div>

            <!-- Exercise List (JS fills this) -->
            <div id="exercise-list" style="margin-bottom:12px;"></div>

            <!-- Add Exercise Form -->
            <div class="exercise-builder">
                <div class="input-group" style="margin-bottom:8px;">
                    <input type="text" id="ex-name" class="input-field" placeholder="Exercise (e.g. Shoulder Press)"
                        style="font-size:14px;">
                </div>
                <div style="display:flex; gap:8px;">
                    <div style="flex:1;"><input type="number" id="ex-sets" class="input-field" placeholder="Sets"
                            style="font-size:14px;"></div>
                    <div style="flex:1;"><input type="number" id="ex-reps" class="input-field" placeholder="Reps"
                            style="font-size:14px;"></div>
                    <div style="flex:1;"><input type="number" id="ex-weight" class="input-field" placeholder="kg"
                            style="font-size:14px;"></div>
                </div>
                <button class="btn"
                    style="width:100%; margin-top:8px; background:var(--c-volt); border:2px solid var(--c-black); font-size:13px;"
                    onclick="addExerciseToBuilder()">+ ADD EXERCISE</button>
            </div>

            <div style="display:flex; gap:12px; margin-top:20px;">
                <button class="btn" style="flex:1;" onclick="closeLogWorkout()">CANCEL</button>
                <button class="btn btn-red" style="flex:1; color:white;" onclick="saveLogWorkout()">🏁 FINISH</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <div class="user-chip">
                <div class="user-avatar"></div>
                Saeed
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="streak-badge">🔥 12</div>
                <button class="icon-btn" style="padding:8px; border:2px solid black; border-radius:50%;">
                    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view-section active">

            <!-- CALENDAR STRIP -->
            <div id="calendar-strip" class="calendar-strip">
                <!-- JS Injects -->
            </div>

            <!-- AI INSIGHT -->
            <div class="ai-insight" id="ai-insight">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="text-label" style="opacity:1;">🤖 AI COACH</span>
                    <span class="text-label" style="color:var(--c-black); opacity:0.5;">NOW</span>
                </div>
                <div id="ai-message" style="font-weight:700; font-size:13px; line-height:1.4;">"Start your day right.
                    Log your first meal!"</div>
            </div>

            <!-- HERO ROW: Ring + Macros -->
            <div class="card hero-card">
                <div class="hero-ring">
                    <svg class="ring-svg" viewBox="0 0 100 100">
                        <circle class="ring-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="ring-val" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="ring-content">
                        <div class="text-hero red-text" style="font-size:24px;">0</div>
                        <div class="text-label" style="font-size:9px;">KCAL</div>
                    </div>
                </div>
                <div class="macro-grid">
                    <div class="macro-row">
                        <div class="macro-label" style="color:#FFD700;">P</div>
                        <div class="macro-track">
                            <div id="macro-p" class="macro-fill fill-p" style="width:0%"></div>
                        </div>
                        <div id="val-p" class="macro-val">0g</div>
                    </div>
                    <div class="macro-row">
                        <div class="macro-label" style="color:#00BFFF;">C</div>
                        <div class="macro-track">
                            <div id="macro-c" class="macro-fill fill-c" style="width:0%"></div>
                        </div>
                        <div id="val-c" class="macro-val">0g</div>
                    </div>
                    <div class="macro-row">
                        <div class="macro-label" style="color:#FF4500;">F</div>
                        <div class="macro-track">
                            <div id="macro-f" class="macro-fill fill-f" style="width:0%"></div>
                        </div>
                        <div id="val-f" class="macro-val">0g</div>
                    </div>
                    <div class="macro-goal-text" id="macro-goal-text">Goal: 2,000 kcal</div>
                </div>
            </div>

            <!-- STATS ROW -->
            <div class="stat-grid">
                <div class="mini-stat card">
                    <div class="stat-icon"><svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor"
                            stroke-width="3" fill="none">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
                        </svg></div>
                    <div>
                        <div class="text-h2" id="workout-count">0</div>
                        <div class="text-label">WORKOUTS</div>
                    </div>
                </div>
                <div class="mini-stat card" id="water-card">
                    <div class="stat-icon" style="background:var(--c-volt); color:black;"><svg width="20" height="20"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
                        </svg></div>
                    <div>
                        <div class="text-h2"><span id="water-amount">0</span>L</div>
                        <div class="text-label">WATER</div>
                    </div>
                    <div class="water-fill-container">
                        <div id="water-bar" class="water-fill-bar"></div>
                    </div>
                </div>
            </div>

            <!-- DAILY LOG FEED -->
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <div class="text-label">TODAY'S LOG</div>
                <div class="text-label" style="opacity:0.5;" id="log-count">0 ENTRIES</div>
            </div>
            <div id="daily-log-feed" class="daily-log-feed">
                <!-- JS Injects Log Items -->
            </div>

        </section>

        <!-- WORKOUTS VIEW -->
        <section id="view-workouts" class="view-section">
            <h2 class="text-h2">Workout Library</h2>
            <div class="workout-list" style="flex:1; overflow-y:auto; padding-bottom:20px;">
                <!-- JS Injects -->
            </div>
        </section>

        <!-- STATS VIEW -->
        <section id="view-stats" class="view-section">
            <h2 class="text-h2">Weekly Stats</h2>
            <div class="card">
                <div class="bar-chart"
                    style="display:flex; justify-content:space-between; align-items:flex-end; height:120px; padding-top:20px;">
                    <div style="width:10px; height:40%; background:var(--c-red-light); border-radius:5px;"></div>
                    <div style="width:10px; height:60%; background:var(--c-red-light); border-radius:5px;"></div>
                    <div style="width:10px; height:80%; background:var(--c-red); border-radius:5px;"></div>
                    <div style="width:10px; height:30%; background:var(--c-red-light); border-radius:5px;"></div>
                    <div style="width:10px; height:50%; background:var(--c-red-light); border-radius:5px;"></div>
                </div>
            </div>
        </section>

        <!-- PROFILE VIEW -->
        <section id="view-profile" class="view-section">
            <h2 class="text-h2">Profile</h2>
            <div class="card" style="text-align:center;">
                <div class="user-avatar" style="width:80px; height:80px; margin:0 auto 16px;"></div>
                <div class="text-h2">Saeed</div>
                <div class="text-label">GOAL: MUSCLE GAIN</div>
            </div>
        </section>

        <!-- DOCK -->
        <nav class="dock">
            <button class="nav-item active" data-target="dashboard">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
            </button>
            <button class="nav-item" data-target="workouts">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                    <polyline points="17 2 12 7 7 2"></polyline>
                </svg>
            </button>
            <button class="nav-fab">
                <svg width="32" height="32" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4" fill="none">
                    <path d="M12 5v14M5 12h14" />
                </svg>
            </button>
            <button class="nav-item" data-target="stats">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                    <path d="M18 20V10" />
                    <path d="M12 20V4" />
                    <path d="M6 20v-6" />
                </svg>
            </button>
            <button class="nav-item" data-target="profile">
                <svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" fill="none">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </button>
        </nav>

    </div>

    <script src="state.js"></script>
    <script src="app.js"></script>
</body>

</html>
